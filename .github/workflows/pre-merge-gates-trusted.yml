name: Pre-merge gates

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pre-merge-gates-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  gates:
    name: Pre-merge gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record changed files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          merge_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          git diff --name-only -z "$merge_base" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files"

      - name: Scan the PR commit range for secrets
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/gitleaks.toml"
          export GITLEAKS_CONFIG="$RUNNER_TEMP/gitleaks.toml"
          trusted_ignore="$RUNNER_TEMP/gitleaksignore"
          : > "$trusted_ignore"
          merge_base=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          "$RUNNER_TEMP/gitleaks" detect --source=. --config="$GITLEAKS_CONFIG" \
            --gitleaks-ignore-path="$trusted_ignore" --redact --verbose --exit-code=1 \
            --log-opts="${merge_base}..${HEAD_SHA}"

      - name: Check changed shell scripts
        env:
          SHELLCHECK_VERSION: "0.11.0"
          SHELLCHECK_SHA256: "b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6"
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r -d '' file; do
            [[ "$file" == *.sh && -f "$file" ]] && files+=("$file")
          done < "$RUNNER_TEMP/changed-files"
          if (( ${#files[@]} == 0 )); then
            echo "No changed shell scripts"
            exit 0
          fi
          archive="$RUNNER_TEMP/shellcheck.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.gz" \
            --output "$archive"
          echo "$SHELLCHECK_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          for file in "${files[@]}"; do
            bash -n "$file"
            "$RUNNER_TEMP/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" --severity=warning "$file"
          done

      - name: Compile changed Python files
        run: |
          set -euo pipefail
          files=()
          while IFS= read -r -d '' file; do
            [[ "$file" == *.py && -f "$file" ]] && files+=("$file")
          done < "$RUNNER_TEMP/changed-files"
          if (( ${#files[@]} == 0 )); then
            echo "No changed Python files"
            exit 0
          fi
          python3 -I -m py_compile "${files[@]}"
